  <body>

        <!-- Filter Bar -->

    <!-- Accessible Lightbox Modal -->

        <img class="lightbox-img" id="lightboxImg" src="" alt="Expanded preview" />
        <div class="lightbox-caption-box" id="lightboxCaption"></div>

    <footer id="main-footer"></footer>

    <script src="common.js"></script>
    <script>
      const galleryItems = [
        {
          title: "SCMS - Primary Dashboard & System Overview",
          sub: "Smart Conference Management System · Main Control Panel",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer.png",
          alt: "Smart Conference Management System - Admin and User Overview Dashboard"
        },
        {
          title: "SCMS - Automated Website Generator",
          sub: "Conference Theme Customization & Landing Page Provisioning",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer%201.png",
          alt: "SCMS - Automated Academic Conference Website Builder"
        },
        {
          title: "SCMS - Paper Submission & Author Dashboard",
          sub: "Manuscript Upload, Metadata Form & Tracking Portal",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer%202.png",
          alt: "SCMS - Author Paper Submission and Tracking Portal"
        },
        {
          title: "SCMS - Reviewer Portal & Evaluation Form",
          sub: "Blind Review Scoring & Recommendation Criteria",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer%203.png",
          alt: "SCMS - Reviewer Portal with Scoring Rubric"
        },
        {
          title: "SCMS - Admin User & Role Authorization Matrix",
          sub: "Granular Permission Gates for Chairs, Authors & Reviewers",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer%204.png",
          alt: "SCMS - Multi-role Access Control Management Interface"
        },
        {
          title: "SCMS - Notification Engine & WhatsApp Webhooks",
          sub: "Real-Time Acceptance Alerts & Automated Email Dispatches",
          category: "SCMS Research",
          image: "img/projects/smart%20conference%20management%20system%20abdul%20qudoos%20php%20developer%205.png",
          alt: "SCMS - WhatsApp Notification Webhook Configuration"
        },
        {
          title: "EchoMind AI - Voice-to-Voice Assistant",
          sub: "Speech Recognition Pipeline with Whisper ASR & OpenRouter",
          category: "AI Applications",
          image: "img/projects/echomind-ai%20abdul%20qudoos%20ai%20developer.png",
          alt: "EchoMind AI - Real-time Voice Audio Pipeline Interface"
        },
        {
          title: "Enterprise Inventory Management System",
          sub: "Stock Control, Relational MySQL Schema & Audit Logs",
          category: "Management Portals",
          image: "img/projects/inventory-solutions%20abdul%20qudoos%20php%20developer.png",
          alt: "Enterprise Inventory Management System - Stock Ledger Interface"
        },
        {
          title: "AI Content & Article Generator",
          sub: "Real-Time Prompt Streaming with Mistral 7B & Laravel",
          category: "AI Applications",
          image: "img/projects/ai-content-generator%20abdul%20qudoos%20php%20developer.png",
          alt: "AI Content Generator - Laravel and Mistral 7B Integration"
        },
        {
          title: "School Management System Dashboard",
          sub: "Live Deployment (indusssn.com) · Student & Staff Management",
          category: "Management Portals",
          image: "img/projects/school-management%20abdul%20qudoos%20php%20developer.png",
          alt: "School Management System Portal Interface"
        },
        {
          title: "E-Portal Management Platform",
          sub: "Institutional Course, Trainer & Trainee Management System",
          category: "Management Portals",
          image: "img/projects/e-portal%20abdul%20qudoos%20php%20developer.png",
          alt: "E-Portal Management Platform - Course and Trainee Views"
        },
        {
          title: "Digital Certificate Verification System",
          sub: "Online Credential Validation & Anti-Forgery Verification",
          category: "Management Portals",
          image: "img/projects/certificate-verification%20abdul%20qudoos%20php%20developer.png",
          alt: "Certificate Verification System Interface"
        }
      ];

      function buildGallery(filter = "all") {
        const grid = document.getElementById("galleryGrid");
        if (!grid) return;

        const filtered = filter === "all"
          ? galleryItems
          : galleryItems.filter((item) => item.category === filter);

        grid.innerHTML = filtered
          .map((item, idx) => `
            <div class="gallery-card fade-in-up visible" style="transition-delay: ${idx * 0.05}s" data-img="${item.image}" data-title="${item.title}" data-sub="${item.sub}" tabindex="0" role="button" aria-label="Open screenshot for ${item.title}">
              <img 
                src="${item.image}" 
                alt="${item.alt || item.title}" 
                loading="lazy"
                decoding="async"
                width="600"
                height="375"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&auto=format&fit=crop&q=80';"
              />
              <div class="gallery-overlay">
                <div class="gallery-caption">${item.title}</div>
                <div class="gallery-sub">${item.sub}</div>
              </div>
            </div>
          `)
          .join("");

        // Attach click & enter key handlers for lightbox
        document.querySelectorAll(".gallery-card").forEach((card) => {
          const open = () => {
            const imgSrc = card.getAttribute("data-img");
            const title = card.getAttribute("data-title");
            const sub = card.getAttribute("data-sub");

            const lbImg = document.getElementById("lightboxImg");
            const lbCap = document.getElementById("lightboxCaption");
            const lb = document.getElementById("lightbox");

            if (lbImg && lbCap && lb) {
              lbImg.src = imgSrc;
              lbImg.alt = title;
              lbCap.innerHTML = `<p style="font-weight: 700;">${title}</p><p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem;">${sub}</p>`;
              lb.classList.add("active");
              document.body.style.overflow = "hidden";
            }
          };

          card.addEventListener("click", open);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              open();
            }
          });
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        buildGallery("all");

        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach((btn) => {
          btn.addEventListener("click", function () {
            filterBtns.forEach((b) => {
              b.classList.remove("active");
              b.setAttribute("aria-selected", "false");
            });
            this.classList.add("active");
            this.setAttribute("aria-selected", "true");
            buildGallery(this.getAttribute("data-filter"));
          });
        });

        // Lightbox Close Logic
        const lb = document.getElementById("lightbox");
        const closeBtn = document.getElementById("closeLightbox");

        const closeLb = () => {
          if (lb) {
            lb.classList.remove("active");
            document.body.style.overflow = "";
          }
        };

        if (closeBtn) closeBtn.addEventListener("click", closeLb);
        if (lb) {
          lb.addEventListener("click", (e) => {
            if (e.target === lb) closeLb();
          });
        }

        // Close on Escape key
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && lb && lb.classList.contains("active")) {
            closeLb();
          }
        });
      });
    </script>
