    <!-- Critical inline CSS: instant boot loader, no FOUC -->
    <style>
  :root { --boot-bg:#f7f8fc; --boot-ink:#0b1020; --boot-blue:#4f46e5; }
  html, body { margin:0; background:var(--boot-bg); }
  #boot { position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
          background:var(--boot-bg); transition:opacity .45s ease, visibility .45s ease; }
  #boot.hide { opacity:0; visibility:hidden; }
  .boot-mark { display:grid; place-items:center; width:64px; height:64px; border-radius:18px;
               background:linear-gradient(120deg,#4f46e5,#7c3aed); color:#fff;
               font:700 1.3rem Sora,system-ui,sans-serif; letter-spacing:-.04em;
               box-shadow:0 18px 40px -18px rgba(79,70,229,.9);
               animation:bootPop .6s cubic-bezier(.23,1,.32,1) both; }
  .boot-bar { display:block; width:120px; height:3px; margin:20px auto 0; border-radius:3px;
              background:#e6e9f4; overflow:hidden; }
  .boot-bar i { display:block; width:40%; height:100%; border-radius:3px;
                background:linear-gradient(90deg,#4f46e5,#22d3ee);
                animation:bootSlide 1.1s ease-in-out infinite; }
  @keyframes bootPop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:none} }
  @keyframes bootSlide { 0%{transform:translateX(-110%)} 100%{transform:translateX(310%)} }
  @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar i { animation:none } }
</style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div>
        <div class="boot-mark">AQ</div>
        <span class="boot-bar"><i></i></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
